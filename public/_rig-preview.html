<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Bunny rig preview</title>
<style>
  body { margin:0; background:#f7f1e8; font-family: system-ui; }
  .row { display:flex; align-items:flex-start; gap:24px; padding:24px; }
  .frame {
    position: relative;
    width: 467px;
    aspect-ratio: 934 / 1040;
    background:#ffffff77;
    border:1px solid #ddd;
  }
  .frame img.ref {
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0.55;
  }
  .rig {
    position:absolute; inset:0; width:100%; height:100%;
  }
  .rig img {
    position:absolute; pointer-events:none;
  }
  .label { font-size:14px; color:#555; padding:0 24px; }
</style>
</head>
<body>
<div class="label">Left: idle reference (55% opacity). Center: rig only. Right: rig overlaid on reference.</div>
<div class="row">
  <div class="frame">
    <img class="ref" src="/assets/bunny/bunny_idle.png" />
  </div>
  <div class="frame">
    <div class="rig" id="rigA"></div>
  </div>
  <div class="frame">
    <img class="ref" src="/assets/bunny/bunny_idle.png" />
    <div class="rig" id="rigB"></div>
  </div>
</div>

<script type="module">
const CANVAS_W = 934, CANVAS_H = 1040;
const PARTS_BASE = "/assets/bunny/bunny_parts";

// Mirror of bunny-rig.ts so we can iterate visually without running Next.
const NAT = {
  ear_idle:           { w: 209, h: 552 },
  body_legs:          { w: 374, h: 503 },
  head:               { w: 404, h: 400 },
  arm_left:           { w: 208, h: 172 },
  arm_right:          { w: 187, h: 179 },
  cheek_left:         { w: 89,  h: 79  },
  cheek_right:        { w: 97,  h: 87  },
  eye:                { w: 72,  h: 83  },
  mouth_closed:       { w: 171, h: 161 },
  flower:             { w: 198, h: 190 },
};
const sized = (tw, n) => [tw, Math.round(tw * n.h / n.w)];

const PARTS = {
  ear_left_idle:  { src:"ear_left_idle.png",  size: sized(150, NAT.ear_idle),  cx:145, cy:285, z:1 },
  ear_right_idle: { src:"ear_right_idle.png", size: sized(150, NAT.ear_idle),  cx:790, cy:285, z:1 },
  body_legs:      { src:"body_legs.png",      size: sized(265, NAT.body_legs), cx:467, cy:670, z:2 },
  head:           { src:"head.png",           size: sized(295, NAT.head),      cx:467, cy:335, z:3 },
  arm_left:       { src:"arm_left.png",       size: sized(135, NAT.arm_left),  cx:322, cy:450, z:4 },
  arm_right:      { src:"arm_right.png",      size: sized(125, NAT.arm_right), cx:612, cy:450, z:4 },
  cheek_swirl_left:  { src:"cheek_swirl_left.png",  size: sized(72, NAT.cheek_left),  cx:322, cy:372, z:5 },
  cheek_swirl_right: { src:"cheek_swirl_right.png", size: sized(76, NAT.cheek_right), cx:612, cy:372, z:5 },
  eye_left:       { src:"eye_left.png",       size: sized(64, NAT.eye),         cx:388, cy:298, z:6 },
  eye_right:      { src:"eye_right.png",      size: sized(64, NAT.eye),         cx:545, cy:298, z:6 },
  mouth_closed:   { src:"mouth_closed1.png",  size: sized(155, NAT.mouth_closed), cx:467, cy:378, z:6 },
  flower:         { src:"flower.png",         size: sized(125, NAT.flower),       cx:555, cy:145, z:7 },
};

const ORDER = ["ear_left_idle","ear_right_idle","body_legs","head","arm_left","arm_right","cheek_swirl_left","cheek_swirl_right","eye_left","eye_right","mouth_closed","flower"];

function renderRig(target) {
  const rig = document.getElementById(target);
  ORDER.forEach(id => {
    const p = PARTS[id];
    const [w, h] = p.size;
    const img = document.createElement("img");
    img.src = `${PARTS_BASE}/${p.src}`;
    img.style.left = ((p.cx - w/2)/CANVAS_W*100) + "%";
    img.style.top  = ((p.cy - h/2)/CANVAS_H*100) + "%";
    img.style.width  = (w/CANVAS_W*100) + "%";
    img.style.height = (h/CANVAS_H*100) + "%";
    img.style.zIndex = p.z;
    rig.appendChild(img);
  });
}
renderRig("rigA");
renderRig("rigB");
</script>
</body>
</html>
